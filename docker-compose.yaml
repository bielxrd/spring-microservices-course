version: '3.8'

services:
  main-service:
    build:
      context: ./main-service
    ports:
      - 8888:8888
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - network-service

  notification-service:
    build:
      context: ./notification-service
    ports:
      - 8082:8082
    depends_on:
      main-service:
        condition: service_healthy
    networks:
      - network-service

  task-service:
    build:
      context: ./task-service
    ports:
      - 8081:8081
    depends_on:
      main-service:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - network-service

networks:
  network-service:
    driver: bridge